        <mat-divider vertical style="margin: 10px 8px 10px 8px; border: 100;"></mat-divider>
        <div class="operation-div" fxLayoutAlign="center" fxFlex="40">
            <div *ngIf="show" style="font-size: 40px;">請先從左邊選擇地點</div>
            <div *ngIf="!show" class="device-table">
                <div fxLayout="row" fxLayoutAlign="space-between center">
                    <h2>{{this.unitName}}</h2>
                    <button mat-raised-button style="color: white;" color="primary"
                        (click)="newDeviceByUnitDialog('0ms', '0ms')">新增設備</button>
                </div>
                <table mat-table [dataSource]="deviceDataSource" multiTemplateDataRows="">
                    <ng-container matColumnDef="Id">
                        <th mat-header-cell *matHeaderCellDef> No. </th>
                        <td mat-cell *matCellDef="let element">{{element.Id}}</td>
                    </ng-container>
                    <ng-container matColumnDef="deviceName">
                        <th mat-header-cell *matHeaderCellDef> 設備名稱 </th>
                        <td mat-cell *matCellDef="let element">{{element.deviceName}}</td>
                    </ng-container>
                    <ng-container matColumnDef="devicePlace">
                        <th mat-header-cell *matHeaderCellDef> 地點 </th>
                        <td mat-cell *matCellDef="let element">{{element.devicePlaceName}}</td>
                    </ng-container>
                    <ng-container matColumnDef="operation">
                        <th mat-header-cell *matHeaderCellDef> 操作 </th>
                        <td mat-cell *matCellDef="let element">
                            <!-- 編輯 -->
                            <button mat-icon-button matTooltip="編輯" (click)="editDeviceDialog('0ms', '0ms', element)">
                                <mat-icon style="color: #0000ff;">edit</mat-icon>
                            </button>
                            <!-- 刪除 -->
                            <button mat-icon-button matTooltip="刪除" (click)="deleteDeviceDialog('0ms', '0ms', element)">
                                <mat-icon style="color: #e60000;">delete</mat-icon>
                            </button>
                            <!-- 設備詳細 -->
                            <button [routerLink]="['/app-home/app-device-detail', element.deviceGuid]" mat-icon-button
                                matTooltip="詳細資訊">
                                <mat-icon style="color: #6eba6f;">info</mat-icon>
                            </button>
                        </td>
                    </ng-container>
                    <tr mat-header-row *matHeaderRowDef="deviceDiaplayedColumns"></tr>
                    <tr mat-row *matRowDef="let row; columns: deviceDiaplayedColumns;"></tr>
                </table>
            </div>
        </div>
    </mat-card>

</div>
