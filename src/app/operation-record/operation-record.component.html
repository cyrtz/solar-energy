<div fxLayout="row" fxLayoutAlign="start center">
    <div fxLayout="row" class="pagetitle" fxLayoutAlign="start center" fxFlex="100">
        <div fxLayoutAlign="start center" class="title-icon">
            <mat-icon>edit_note</mat-icon>
            <mat-icon>remove</mat-icon>
        </div>
        <div>操作紀錄</div>
    </div>
    <!-- 搜尋表單 -->
    <div class="tableOperate" fxLayoutAlign="end start" fxFlex="60">
        <form [formGroup]="searchOperateForm">
            <mat-form-field style="margin-right: 20px;" fxFlex="50" color="primary" appearance="outline">
                <mat-label>權限</mat-label>
                <mat-select formControlName="userPermissionsFilter">
                    <mat-option [value]="''">
                        全部
                    </mat-option>
                    <mat-option *ngFor="let access of AccessList" [value]="access.accessLevel">
                        {{access.accessLevel}}
                    </mat-option>
                </mat-select>
            </mat-form-field>
            <mat-form-field style="margin-right: 20px;" fxFlex="50" color="primary" appearance="outline">
                <mat-label>搜尋使用者名稱</mat-label>
                <input matInput formControlName="userNameFilter">
            </mat-form-field>
        </form>
    </div>
</div>
<div class="operateTable">
    <table mat-table [dataSource]="dataSource">
        <!-- logLevel Column -->
        <ng-container matColumnDef="logLevel">
            <th mat-header-cell *matHeaderCellDef class="centerAlign">層級</th>
            <td mat-cell *matCellDef="let element" [ngStyle]="{ color: element.logLevel=='ERROR' ? 'red' : 'black'}"> {{element.logLevel}} </td>
        </ng-container>
        <!-- logUser Column -->
        <ng-container matColumnDef="logUser">
            <th mat-header-cell *matHeaderCellDef class="centerAlign">使用者名稱</th>
            <td mat-cell *matCellDef="let element"> {{element.logUser}} </td>
        </ng-container>
        <!-- userIdentity Column -->
        <ng-container matColumnDef="userIdentity">
            <th mat-header-cell *matHeaderCellDef class="centerAlign">權限</th>
            <td mat-cell *matCellDef="let element"> {{element.userIdentity}} </td>
        </ng-container>
        <!-- logMessage Column -->
        <ng-container matColumnDef="logMessage">
            <th mat-header-cell *matHeaderCellDef class="centerAlign">紀錄訊息</th>
            <td mat-cell *matCellDef="let element"> {{element.logMessage}} </td>
        </ng-container>
        <!-- createTime Column -->
        <ng-container matColumnDef="createTime">
            <th mat-header-cell *matHeaderCellDef class="centerAlign">操作時間</th>
            <td mat-cell *matCellDef="let element"> {{element.createTime | date:"yyyy-MM-dd HH:mm:ss"}} </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns:displayedColumns;"></tr>
    </table>
    <!-- [length]="totalCount" 需要返回參數 -->
    <mat-paginator #paginator (page)="onPageChange($event)" [length]="this.totalPage" pageIndex="0" pageSize="6"
        [pageSizeOptions]="[6,8,10]">
    </mat-paginator>
</div>
