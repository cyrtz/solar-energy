<div class="dialog-title">
    <h1 mat-dialog-title>新增使用者</h1>
</div>
<div mat-dialog-content class="newUserForm">
    <form [formGroup]="newUserForm">
        <div class="rowData">
            <div class="formInput">
                <mat-form-field color="accent">
                    <mat-label for="userAccount">帳號</mat-label>
                    <input matInput id="userAccount" formControlName="userAccount" />
                    <mat-error align="end">
                        <span *ngIf="userAccount?.errors?.['required']">
                            請輸入使用者帳號
                        </span>
                    </mat-error>
                </mat-form-field>
            </div>
            <div class="formInput">
                <mat-form-field color="accent">
                    <mat-label for="userPassword">密碼</mat-label>
                    <input matInput id="userPassword" formControlName="userPassword" placeholder="abc123" />
                    <mat-error align="end">
                        <span *ngIf="userPassword?.errors?.['required']">
                            請輸入使用者密碼
                        </span>
                    </mat-error>
                </mat-form-field>
            </div>
        </div>
        <div class="rowData">
            <div class="formInput">
                <mat-form-field color="accent">
                    <mat-label for="userName">姓名</mat-label>
                    <input matInput id="userName" formControlName="userName" />
                    <mat-error align="end">
                        <span *ngIf="userName?.errors?.['required']">
                            請輸入使用者姓名
                        </span>
                    </mat-error>
                </mat-form-field>
            </div>
            <div class="formInput">
                <mat-form-field color="accent">
                    <mat-label>權限</mat-label>
                    <mat-select formControlName="userIdentity">
                        <mat-option *ngFor="let role of userRoleList" [value]="role">
                            {{ role }}
                        </mat-option>
                    </mat-select>
                    <mat-error align="end">
                        <span *ngIf="userIdentity?.errors?.['required']">
                            請輸入使用者權限
                        </span>
                    </mat-error>
                </mat-form-field>
            </div>
        </div>
        <div class="rowData">
            <div class="formInput">
                <mat-form-field color="accent">
                    <mat-label>行政/教學單位</mat-label>
                    <mat-select formControlName="userDepartment">
                        <mat-option *ngFor="let department of userDepartmentList" [value]="department.departmentName">
                            {{ department.departmentName }}
                        </mat-option>
                    </mat-select>
                    <mat-error align="end">
                        <span *ngIf="userDepartment?.errors?.['required']">
                            請輸入使用者行政/教學單位
                        </span>
                    </mat-error>
                </mat-form-field>
            </div>
            <div class="formInput">
                <mat-form-field color="accent">
                    <mat-label for="userPosition">職位</mat-label>
                    <input matInput id="userPosition" formControlName="userPosition" />
                    <mat-error align="end">
                        <span *ngIf="userPosition?.errors?.['required']">
                            請輸入使用者職位
                        </span>
                    </mat-error>
                </mat-form-field>
            </div>
        </div>
    </form>
</div>
<div mat-dialog-actions class="dialog-action">
    <button mat-raised-button mat-dialog-close>取消</button>
    <button mat-raised-button [mat-dialog-close]="true" (click)="addUser()" color="accent"
        [disabled]="!newUserForm.valid">
        新增
    </button>
</div>
