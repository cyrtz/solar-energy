<div class="dialog-title">
    <h1 mat-dialog-title>編輯設備</h1>
</div>
<div mat-dialog-content>
    <form class="editDeviceForm" [formGroup]="editDeviceForm">
        <div class="formInput">
            <mat-form-field color="accent">
                <mat-label> 設備名稱 </mat-label>
                <input class="cantChange" matInput formControlName="deviceOldName" [(ngModel)]="this.device.deviceName"
                    readonly />
            </mat-form-field>
        </div>
        <div class="formInput">
            <mat-form-field color="accent">
                <mat-label> 新設備名稱 </mat-label>
                <input matInput formControlName="deviceName" placeholder="勿取重複名稱" />
                <mat-error align="end">
                    <span *ngIf="deviceName?.errors?.['minlength']">
                        設備名稱至少要有2個字
                    </span>
                    <span *ngIf="deviceName?.errors?.['uniqueAlterEgo']">
                        設備名稱已存在
                    </span>
                </mat-error>
            </mat-form-field>
        </div>
        <div class="formInput">
            <!-- <input matInput class="cantChange" formControlName="deviceUnitGuid" [(ngModel)]="this.device.deviceUnitName" readonly/> -->
            <mat-form-field color="accent">
                <mat-label>單位</mat-label>
                <mat-select formControlName="deviceUnitGuid" (selectionChange)="onUnitChange($event.value)">
                    <mat-option *ngFor="let unit of unitData" [value]="unit.deviceUnitGuid">
                        {{ unit.deviceUnitName }}
                    </mat-option>
                </mat-select>
            </mat-form-field>

        </div>
        <div class="formInput">
            <mat-form-field color="accent">
                <mat-label> 地點 </mat-label>
                <mat-select formControlName="devicePlaceGuid" [disabled]="!isUnitSelected">
                    <mat-option *ngFor="let place of devicePlaceNameList" [value]="place.devicePlaceGuid">
                        {{place.devicePlaceName}}
                    </mat-option>
                    <mat-option *ngIf="devicePlaceGuid?.errors?.['noPlaces']" [disabled]="true">
                        此單位無地點
                    </mat-option>
                </mat-select>
                <mat-error align="end">
                    <span *ngIf="!isUnitSelected">
                        請先選擇單位
                    </span>
                    <span *ngIf="devicePlaceGuid?.errors?.['noPlaces']">
                        請先新增地點
                    </span>
                </mat-error>
            </mat-form-field>
        </div>
    </form>
</div>
<div mat-dialog-actions class="dialog-action">
    <button mat-raised-button mat-dialog-close>取消</button>
    <button mat-raised-button [mat-dialog-close]="true" (click)="edit()" color="accent"
        [disabled]="!editDeviceForm.valid">修改</button>
</div>
