<div fxLayout="column" fxLayoutAlign=" center" style="height: 480px;">
    <div fxFlex="20" style="width: 100%;">
        <div class="title" fxLayout="row" fxLayoutAlign="center center">編輯設備</div>
    </div>
    <div fxFlex="60" class="content" fxLayout="column" fxLayoutAlign="space-around ">
        <form class="editDeviceForm" [formGroup]="editDeviceForm" fxLayout="column" fxLayoutAlign="space-around center">
            <mat-form-field color="primary" appearance="outline" style="width: 60%;">
                <mat-label>設備名稱</mat-label>
                <input class="cantChange" matInput formControlName="deviceOldName" [(ngModel)]="this.device.deviceName"
                    readonly />
            </mat-form-field>
            <mat-form-field color="primary" appearance="outline" style="width: 60%;">
                <mat-label> 新設備名稱 </mat-label>
                <input matInput formControlName="deviceName" placeholder="勿取重複名稱" />
                <mat-error align="end">
                    <span *ngIf="deviceName?.errors?.['minlength']">
                        設備名稱至少要有2個字
                    </span>
                    <span *ngIf="deviceName?.errors?.['uniqueAlterEgo']">
                        設備名稱已存在
                    </span>
                </mat-error>
            </mat-form-field>
            <mat-form-field color="primary" appearance="outline" style="width: 60%;">
                <mat-label>單位</mat-label>
                <mat-select formControlName="deviceUnitGuid" (selectionChange)="onUnitChange($event.value)">
                    <mat-option *ngFor="let unit of unitData" [value]="unit.deviceUnitGuid">
                        {{ unit.deviceUnitName }}
                    </mat-option>
                </mat-select>
            </mat-form-field>
            <mat-form-field color="primary" appearance="outline" style="width: 60%;">
                <mat-label> 地點 </mat-label>
                <mat-select formControlName="devicePlaceGuid" [disabled]="!isUnitSelected">
                    <mat-option *ngFor="let place of devicePlaceNameList" [value]="place.devicePlaceGuid">
                        {{place.devicePlaceName}}
                    </mat-option>
                    <mat-option *ngIf="devicePlaceGuid?.errors?.['noPlaces']" [disabled]="true">
                        此單位無地點
                    </mat-option>
                </mat-select>
                <mat-error align="end">
                    <span *ngIf="!isUnitSelected">
                        請先選擇單位
                    </span>
                    <span *ngIf="devicePlaceGuid?.errors?.['noPlaces']">
                        請先新增地點
                    </span>
                </mat-error>
            </mat-form-field>
        </form>
    </div>
    <div fxFlex="20" class="footer" fxLayout="row" fxLayoutAlign="space-evenly end">
        <button mat-raised-button mat-dialog-close>
            <div fxLayout="row" fxLayoutAlign="center center" style="color: red;">
                <mat-icon>close</mat-icon>
                取消
            </div>
        </button>
        <button mat-raised-button [mat-dialog-close]="true" (click)="edit()"
            style="margin-left: 10px; color: white;" [disabled]="!editDeviceForm.valid" color="accent">
            <div fxLayout="row" fxLayoutAlign="center center">
                <mat-icon>edit</mat-icon>
                修改
            </div>
        </button>
    </div>
</div>
