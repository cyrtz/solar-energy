<div fxLayout="column" fxLayoutAlign=" center" style="height: 320px;">
    <div fxFlex="20" class="title" fxLayout="column" fxLayoutAlign="center center">刪除使用者</div>
    <div fxFlex="60" class="content" fxLayout="column" fxLayoutAlign="space-around ">
        <div><b>帳號：</b> {{userInfo.userAccount}}</div>
        <div><b>姓名：</b> {{userInfo.userName}}</div>
        <div><b>權限：</b> {{userInfo.userIdentity}}</div>
        <div><b>行政/教學單位：</b> {{userInfo.userDepartment}}</div>
    </div>
    <div fxFlex="20" class="footer" fxLayout="row" fxLayoutAlign="space-evenly center">
        <button mat-raised-button mat-dialog-close>
            <div fxLayout="row" fxLayoutAlign="center center">
                <mat-icon>close</mat-icon>
                取消
            </div>
        </button>
        <button mat-raised-button [mat-dialog-close]="true" style="margin-left: 10px;" color="warn"
            (click)="delete()">
            <div fxLayout="row" fxLayoutAlign="center center">
                <mat-icon>delete</mat-icon>
                刪除
            </div>
        </button>
    </div>
</div>
