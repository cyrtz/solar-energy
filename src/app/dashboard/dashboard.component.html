<div class="dashboardMain" fxLayout="row" fxLayoutAlign="center start">
    <mat-card class="mainInfo" fxFlex="55">
        <mat-card-header class="mainTitle">
            <mat-card-title>總節碳量</mat-card-title>
        </mat-card-header>
        <mat-card-content>
            <!-- 包含非同步載入 Tab Content 的 Tab Group -->
            <ng-container *ngIf="asyncCRTabs | async as tabs; else loading">
                <mat-tab-group (selectedTabChange)="onCRTabChange($event)">
                    <mat-tab *ngFor="let tab of tabs">
                        <ng-template mat-tab-label>{{tab.label}}</ng-template>
                        <ng-container *ngIf="activeCRTab === tab.content">
                            <ng-container [ngComponentOutlet]="tab.content"></ng-container>
                        </ng-container>
                    </mat-tab>
                </mat-tab-group>
            </ng-container>
            <ng-template #loading>Loading tabs...</ng-template>
        </mat-card-content>
        <mat-card-actions>
            {{this.toDate}}<br>
            碳排放量：{{this.totalCarbon}} kg
        </mat-card-actions>
    </mat-card>
    <div fxFlex="1"></div>
    <div class="secondaryInfoCol" fxLayout="column" fxLayoutAlign="start start" fxFlex="44">
        <mat-card class="secondaryInfo">
            <mat-card-header class="secondaryTitle">
                <mat-card-title>總發電量</mat-card-title>
                <span style="margin-top: 2px;font-size: 16px;">度(累計)</span>
            </mat-card-header>
            <mat-card-content>
                <!-- 包含非同步載入 Tab Content 的 Tab Group -->
                <ng-container *ngIf="asyncPGTabs | async as tabs; else loading">
                    <mat-tab-group (selectedTabChange)="onPGTabChange($event)">
                        <mat-tab *ngFor="let tab of tabs">
                            <ng-template mat-tab-label>{{tab.label}}</ng-template>
                            <ng-container style="height: 100%;" *ngIf="activePGTab === tab.content">
                                <ng-container [ngComponentOutlet]="tab.content"></ng-container>
                            </ng-container>
                        </mat-tab>
                    </mat-tab-group>
                </ng-container>
                <ng-template #loading>Loading tabs...</ng-template>
            </mat-card-content>
            <mat-card-actions>
                發電量：{{this.totalPower}} 度
            </mat-card-actions>
        </mat-card>
        <div fxFlex="2"></div>
        <div class="thirdInfoRow">
            <mat-card class="thirdInfo">
                <mat-card-header class="thirdTitle">
                    <mat-card-title>設備總數</mat-card-title>
                </mat-card-header>
                <mat-card-content class="deviceTotal">
                    <!-- 內容 -->
                    <button mat-button class="deviceTotalQuantity" [routerLink]="'../app-device-manage'">{{totalPage}}</button>
                </mat-card-content>
            </mat-card>
            <div fxFlex="2"></div>
            <mat-card class="thirdInfo">
                <mat-card-header class="thirdTitle">
                    <mat-card-title>異常設備數</mat-card-title>
                </mat-card-header>
                <mat-card-content class="deviceError">
                    <!-- 內容 -->
                    <button mat-button [routerLink]="'../app-error-detect'" class="deviceErrorQuantity">{{this.errorDevice}}</button>
                </mat-card-content>
            </mat-card>
        </div>
        <div fxFlex="2"></div>
        <div class="thirdInfoRow">
            <mat-card class="thirdInfo">
                <mat-card-header class="thirdTitle">
                    <mat-card-title>進行中設備數</mat-card-title>
                </mat-card-header>
                <mat-card-content class="runningDevice">
                    <!-- 內容 -->
                    <button mat-button class="deviceTotalQuantity" [routerLink]="'../app-device-manage'" class="runningDeviceQuantity">{{totalPage - this.errorDevice}}</button>
                </mat-card-content>
            </mat-card>
            <div fxFlex="2"></div>
            <mat-card class="thirdInfo">
                <mat-card-header class="thirdTitle">
                    <mat-card-title>已節省電費（累計）</mat-card-title>
                </mat-card-header>
                <mat-card-content class="savedEBills">
                    <!-- 內容 -->
                    <p class="savedEBillsQuantity">0</p>
                </mat-card-content>
            </mat-card>
        </div>
    </div>
</div>
