<div fxLayout="row" fxLayoutAlign="start center" class="pageheader">
  <div fxLayout="row" class="pagetitle" fxLayoutAlign="start center" fxFlex="40">
    <div fxLayoutAlign="end center" class="title-icon">
      <mat-icon>domain_add</mat-icon>
      <mat-icon>remove</mat-icon>
    </div>
    <div>單位管理</div>
  </div>
  <div class="tableOperate" fxLayoutAlign="end start" fxFlex="40">
    <form [formGroup]="searchUnitForm">
      <mat-form-field color="primary" appearance="outline">
        <mat-label>搜尋單位名稱</mat-label>
        <input matInput formControlName="unitNameFilter">
      </mat-form-field>
    </form>
  </div>
  <div fxFlex="20" fxLayout="row" fxLayoutAlign="space-evenly center">
    <button mat-raised-button style="font-weight: bold; color: white; background: #efd74d; height: 56px; width: 120px; font-size: 16px;"
      (click)="newUnitDialog('0ms', '0ms')">
      <div fxLayout="row" fxLayoutAlign="center center">
        <mat-icon>add</mat-icon>
        新增單位
      </div>
    </button>
    <button mat-raised-button style="font-weight: bold; color: white; background: #efd74d; height: 56px; width: 120px; font-size: 16px;"
      (click)="newPlaceDialog('0ms', '0ms')">
      <div fxLayout="row" fxLayoutAlign="center center">
        <mat-icon>add</mat-icon>
        新增地點
      </div>
    </button>
  </div>
</div>
<div class="card-div">
  <mat-card *ngFor="let element of placeList" class="unit-card">
    <mat-card-header fxLayoutAlign="center center" class="card-title">
      <div>{{element.name}}</div>
      <div>
        <button mat-icon-button matTooltip="刪除" (click)="deleteDialog('0ms', '0ms', element.unitGuid)">
          <mat-icon style="color: #AE0000;">delete</mat-icon>
        </button>
      </div>
    </mat-card-header>
    <mat-card-content class="place-table">
      <table mat-table [dataSource]="element.data" multiTemplateDataRows>
        <ng-container matColumnDef="Id">
          <th mat-header-cell *matHeaderCellDef> No. </th>
          <td mat-cell *matCellDef="let element"> {{element.Id}} </td>
        </ng-container>
        <ng-container matColumnDef="devicePlaceName">
          <th mat-header-cell *matHeaderCellDef> 地點名稱 </th>
          <td mat-cell *matCellDef="let element"> {{element.devicePlaceName}} </td>
        </ng-container>
        <ng-container matColumnDef="operation">
          <th mat-header-cell *matHeaderCellDef>操作</th>

          <td mat-cell *matCellDef="let element">
            <button mat-icon-button matTooltip="刪除" (click)="deletePlaceDialog('0ms', '0ms', element)">
              <mat-icon style="color: #AE0000;">delete</mat-icon>
            </button>
          </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="placeDisplayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: placeDisplayedColumns;"></tr>
      </table>
    </mat-card-content>
  </mat-card>
</div>
