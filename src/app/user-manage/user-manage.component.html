<div fxLayout="row" fxLayoutAlign="start center" class="pageheader">
    <div fxLayout="row" class="pagetitle" fxLayoutAlign="start center" fxFlex="40">
        <div fxLayoutAlign="start center" class="title-icon">
            <mat-icon>manage_accounts</mat-icon>
            <mat-icon>remove</mat-icon>
        </div>
        <div>會員管理</div>
    </div>
    <!-- 搜尋表單 -->
    <div class="tableOperate" fxLayoutAlign="end start" fxFlex="60">
        <form [formGroup]="searchUserForm">
            <mat-form-field style="margin-right: 20px;" fxFlex="50" color="accent">
                <mat-label>部門</mat-label>
                <mat-select formControlName="userDepartmentFilter">
                    <mat-option [value]="''">
                        全部
                    </mat-option>
                    <mat-option *ngFor="let user of userDepartment" [value]="user.departmentGuid">
                        {{user.departmentName}}
                    </mat-option>
                </mat-select>
            </mat-form-field>
            <mat-form-field style="margin-right: 20px;" fxFlex="50" color="accent">
                <mat-label>搜尋會員名稱</mat-label>
                <input matInput formControlName="userNameFilter">
            </mat-form-field>
        </form>
        <button mat-raised-button style="color: white;" color="primary" (click)="newDialog('0ms', '0ms')">新增會員</button>
    </div>
</div>
<div class="userTable">
    <table mat-table [dataSource]="dataSource">
        <!-- userAccount Column -->
        <ng-container matColumnDef="userAccount">
            <th mat-header-cell *matHeaderCellDef class="centerAlign">帳號</th>
            <td mat-cell *matCellDef="let element"> {{element.userAccount}} </td>
        </ng-container>
        <!-- userName Column -->
        <ng-container matColumnDef="userName">
            <th mat-header-cell *matHeaderCellDef class="centerAlign">名稱</th>
            <td mat-cell *matCellDef="let element"> {{element.userName}} </td>
        </ng-container>
        <!-- userIdentity Column -->
        <ng-container matColumnDef="userIdentity">
            <th mat-header-cell *matHeaderCellDef class="centerAlign">權限</th>
            <td mat-cell *matCellDef="let element"> {{element.userIdentity}} </td>
        </ng-container>
        <!-- userDepartment Column -->
        <ng-container matColumnDef="userDepartment">
            <th mat-header-cell *matHeaderCellDef class="centerAlign">部門</th>
            <td mat-cell *matCellDef="let element"> {{element.userDepartment}} </td>
        </ng-container>
        <!-- userEmail Column -->
        <ng-container matColumnDef="userEmail">
            <th mat-header-cell *matHeaderCellDef class="centerAlign">信箱</th>
            <td mat-cell *matCellDef="let element" > {{element.userEmail}} </td>
        </ng-container>
        <!-- userPhone Column -->
        <ng-container matColumnDef="userPhone">
            <th mat-header-cell *matHeaderCellDef class="centerAlign">電話</th>
            <td mat-cell *matCellDef="let element"> {{element.userPhone}} </td>
        </ng-container>
        <!-- operation Column -->
        <ng-container matColumnDef="operation">
            <th mat-header-cell *matHeaderCellDef class="centerAlign"> 操作 </th>
            <td mat-cell *matCellDef="let element">
                <!-- 編輯 -->
                <button mat-icon-button matTooltip="編輯">
                    <!-- (click)="editDialog('0ms', '0ms', element)" -->
                    <mat-icon style="color: #0000ff;">edit</mat-icon>
                </button>
                <!-- 刪除 -->
                <button mat-icon-button matTooltip="刪除">
                    <!-- (click)="deleteDialog('0ms', '0ms', element)" -->
                    <mat-icon style="color: #e60000;">delete</mat-icon>
                </button>
                <!-- 詳細資訊 -->
                <button  mat-icon-button
                    matTooltip="詳細資訊">
                    <!-- [routerLink]="['/app-home/app-device-detail', element.deviceGuid]" -->
                    <mat-icon style="color: #6eba6f;">info</mat-icon>
                </button>
            </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns:displayedColumns;"></tr>
    </table>
    <!-- [length]="totalCount" 需要返回參數 -->
    <mat-paginator #paginator (page)="onPageChange($event)" [length]="this.totalPage" pageIndex="0" pageSize="6"
        [pageSizeOptions]="[6,8,10]">
    </mat-paginator>
</div>
