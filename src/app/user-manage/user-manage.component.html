<div fxLayout="row" fxLayoutAlign="start center">
    <div fxLayout="row" class="pagetitle" fxLayoutAlign="start center" fxFlex="40">
        <div fxLayoutAlign="start center" class="title-icon">
            <mat-icon>manage_accounts</mat-icon>
            <mat-icon>remove</mat-icon>
        </div>
        <div>使用者管理</div>
    </div>
    <!-- 搜尋表單 -->
    <div class="tableOperate" fxLayoutAlign="end center" fxFlex="50">
        <form [formGroup]="searchUserForm">
            <mat-form-field style="margin-right: 20px;" fxFlex="50" color="primary" appearance="outline">
                <mat-label>行政/教學單位</mat-label>
                <mat-select formControlName="userDepartmentFilter">
                    <mat-option [value]="''">
                        全部
                    </mat-option>
                    <mat-option *ngFor="let user of userDepartment" [value]="user.departmentName">
                        {{user.departmentName}}
                    </mat-option>
                </mat-select>
            </mat-form-field>
            <mat-form-field fxFlex="50" color="primary" appearance="outline">
                <mat-label>搜尋使用者名稱</mat-label>
                <input matInput formControlName="userNameFilter">
            </mat-form-field>
        </form>
    </div>
    <div fxFlex="10" fxLayoutAlign="space-around center" style="margin-right: 12px;">
        <button mat-raised-button style="font-weight: bold; color: white; background: #efd74d ; height: 48px; width: 136px; font-size: 1rem;"
            (click)="newDialog('0ms', '0ms')">
            <div fxLayout="row" fxLayoutAlign="center center">
                <mat-icon>add</mat-icon>
                新增使用者
            </div>
        </button>
    </div>
</div>
<div class="userTable">
    <table mat-table [dataSource]="dataSource">
        <!-- userAccount Column -->
        <ng-container matColumnDef="userAccount">
            <th mat-header-cell *matHeaderCellDef class="centerAlign">帳號</th>
            <td mat-cell *matCellDef="let element"> {{element.userAccount}} </td>
        </ng-container>
        <!-- userName Column -->
        <ng-container matColumnDef="userName">
            <th mat-header-cell *matHeaderCellDef class="centerAlign">名稱</th>
            <td mat-cell *matCellDef="let element"> {{element.userName}} </td>
        </ng-container>
        <!-- userIdentity Column -->
        <ng-container matColumnDef="userIdentity">
            <th mat-header-cell *matHeaderCellDef class="centerAlign">權限</th>
            <td mat-cell *matCellDef="let element"> {{element.userIdentity}} </td>
        </ng-container>
        <!-- userDepartment Column -->
        <ng-container matColumnDef="userDepartment">
            <th mat-header-cell *matHeaderCellDef class="centerAlign"> 行政/教學單位</th>
            <td mat-cell *matCellDef="let element"> {{element.userDepartment}} </td>
        </ng-container>
        <!-- userEmail Column -->
        <ng-container matColumnDef="userEmail">
            <th mat-header-cell *matHeaderCellDef class="centerAlign">信箱</th>
            <td mat-cell *matCellDef="let element">
                <span [ngStyle]="{color: element.userEmail ? 'black' : 'gray'}">
                    {{element.userEmail ? element.userEmail : '選填'}}
                </span>
            </td>
        </ng-container>
        <!-- userPhone Column -->
        <ng-container matColumnDef="userPhone">
            <th mat-header-cell *matHeaderCellDef class="centerAlign">電話</th>
            <td mat-cell *matCellDef="let element">
                <span [ngStyle]="{color: element.userPhone ? 'black' : 'gray'}">
                    {{ element.userPhone ? element.userPhone : '選填'}}
                </span>
            </td>
        </ng-container>
        <!-- operation Column -->
        <ng-container matColumnDef="operation">
            <th mat-header-cell *matHeaderCellDef class="centerAlign"> 操作 </th>
            <td mat-cell *matCellDef="let element">
                <!-- 刪除 -->
                <ng-container
                    *ngIf="element.userIdentity == 'Viewer' && this.userRole == 'Editor' || this.userRole == 'Admin'">
                    <button mat-icon-button matTooltip="刪除" (click)="deleteDialog('0ms', '0ms', element)">
                        <mat-icon style="color: #e60000;">delete</mat-icon>
                    </button>
                </ng-container>
            </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns:displayedColumns;"></tr>
    </table>
    <!-- [length]="totalCount" 需要返回參數 -->
    <mat-paginator #paginator (page)="onPageChange($event)" [length]="this.totalPage" pageIndex="0" pageSize="6"
        [pageSizeOptions]="[6,8,10]">
    </mat-paginator>
</div>
