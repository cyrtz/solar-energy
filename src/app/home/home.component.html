<mat-drawer-container class="drawer-container">
    <mat-drawer #drawer mode="side" class="drawer-div">
        <div fxLayout="column" class="navbar-spacer">
            <div class="navbar-header" fxFlex="20">
                <img src="assets/img/solar-cell.png" alt="logo" class="logo">
            </div>
            <div class="navbar-content" fxFlex="72" fxLayout="column">
                <button mat-button [routerLink]="'../app-home/'" fxLayoutAlign="start center">
                    <mat-icon>dashboard</mat-icon>
                    戰情室
                </button>
                <button mat-button [routerLink]="'../app-home/app-interactive-map'" fxLayoutAlign="start center">
                    <mat-icon>map</mat-icon>
                    設備地圖
                </button>
                <ng-container *ngIf="userRole === 'Admin' || userRole === 'Editor'">
                    <button mat-button [routerLink]="'../app-home/app-device-manage'" fxLayoutAlign="start center">
                        <mat-icon>construction</mat-icon>
                        設備管理
                    </button>
                </ng-container>
                <ng-container *ngIf="userRole === 'Admin' || userRole === 'Editor'">
                    <button mat-button [routerLink]="'../app-home/app-unit-manage'" fxLayoutAlign="start center">
                        <mat-icon>domain_add</mat-icon>
                        單位管理
                    </button>
                </ng-container>
                <ng-container *ngIf="userRole === 'Admin' || userRole === 'Editor'">
                    <button mat-button [routerLink]="'../app-home/app-user-manage'" fxLayoutAlign="start center">
                        <mat-icon>manage_accounts</mat-icon>
                        使用者管理
                    </button>
                </ng-container>
                <ng-container *ngIf="userRole === 'Admin' || userRole === 'Editor'">
                    <button mat-button (click)="openErrorDetection()" fxLayoutAlign="start center">
                        <mat-icon>error</mat-icon>
                        <div fxLayout="row" fxLayoutAlign="start center">
                            異常檢測
                            <mat-icon *ngIf="!this.showList">arrow_drop_down</mat-icon>
                            <mat-icon *ngIf="this.showList">arrow_drop_up</mat-icon>
                        </div>
                    </button>
                    <div *ngIf="this.showList" style="background: #5DA88C;">
                        <button mat-button [routerLink]="'../app-home/app-error-system'">
                            <div style="margin-left: 28px;">系統異常</div>
                        </button>
                        <button mat-button [routerLink]="'../app-home/app-error-device'">
                            <div style="margin-left: 28px;">設備異常</div>
                        </button>
                    </div>
                    <!-- <mat-accordion>
                        <mat-expansion-panel  style="background: #7CCAAE;" hideToggle>
                            <mat-expansion-panel-header>
                                <mat-panel-title>
                                    異常檢測
                                </mat-panel-title>
                            </mat-expansion-panel-header>
                            <button mat-button [routerLink]="'../app-home/app-error-system'">系統異常</button>
                            <button mat-button [routerLink]="'../app-home/app-error-device'">設備異常</button>
                        </mat-expansion-panel>
                    </mat-accordion> -->
                </ng-container>
                <ng-container *ngIf="userRole === 'Admin' || userRole === 'Editor'">
                    <button mat-button [routerLink]="'../app-home/app-operation-record'" fxLayoutAlign="start center">
                        <mat-icon>edit_note</mat-icon>
                        操作紀錄
                    </button>
                </ng-container>
            </div>
        </div>
    </mat-drawer>
    <mat-drawer-content fxLayout="column" style="background-color: #F8F5F2;">
        <div style="position: sticky; top: 0;z-index: 20000;">
            <div class="toolbar-spacer" fxLayoutAlign="space-between center">
                <div class="toolbar-content" fxLayout="row" fxLayoutAlign="start center">
                    <button mat-icon-button class="menu-icon" (click)="drawer.toggle()">
                        <mat-icon>{{ drawer.opened ? 'close' : 'menu' }}</mat-icon>
                    </button>
                    <div style="color: #335780; font-weight: bold;">太陽能節碳評估系統</div>
                </div>
                <div class="date">
                    {{this.toDate}}
                </div>
                <div class="weatheroverviewdiv" fxLayoutAlign="end center">
                    <!-- <button mat-icon-button class="cloud-icon">
                        <mat-icon>{{ weatheroverview }}</mat-icon>
                    </button> -->
                    <img [src]="weatheroverview" class="weather-icon">
                </div>
                <div class="tempdiv">{{ temperature }}°C</div>
                <div style="width:60px; margin-right: 15px;">
                    <button mat-icon-button [matMenuTriggerFor]="user">
                        <mat-icon style="color: #335780; font-size: 26px;">account_circle</mat-icon>
                    </button>
                    <mat-menu #user="matMenu">
                        <app-user-info></app-user-info>
                    </mat-menu>
                </div>
            </div>
        </div>
        <div style="z-index: 10000; height: 100%; background-color: #F8F5F2; position: relative;">
            <router-outlet></router-outlet>
        </div>
    </mat-drawer-content>
</mat-drawer-container>
